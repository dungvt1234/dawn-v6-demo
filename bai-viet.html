<body class="grain">
<div id="dawn-arc-track"><div id="dawn-arc-fill"></div></div>

 <svg class="absolute left-0 top-0 w-full h-full pointer-events-none" viewBox="0 0 1280 500" preserveAspectRatio="none" style="opacity:.5;">

 <h1 id="bv-title" class="serif text-[36px] md:text-[52px] leading-[1.1] mt-4 max-w-[820px] text-white reveal in">Đang tải bài viết…</h1>
 <div class="mt-5 flex flex-wrap items-center gap-4 text-white/80 text-[14px] reveal in">
 <span id="bv-tag" class="tag"></span>
 <span id="bv-date" class="tracking-[0.08em] font-semibold" style="color:var(--gold);"></span>
 </div>
 </div>
</section>

<section>
 <div class="max-w-[820px] mx-auto px-6 md:px-10 py-16 md:py-20">
 <a href="tin-tuc.html" class="inline-flex items-center gap-2 text-[13px] font-semibold tracking-[0.08em] uppercase transition-colors hover:opacity-70" style="color:var(--forest);">
 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
 Về trang tin tức
 </a>

 <div id="bv-image-wrap" class="mt-8 img-frame" style="border-radius:1.75rem; display:none;">
 <img id="bv-image" src="" loading="lazy" alt="" class="w-full h-auto object-cover">
 </div>

 <article id="bv-body" class="mt-10 prose-article"></article>

 <p class="mt-12 text-[13px]" style="color:var(--forest);">* Bài viết minh họa cho bản demo — nội dung thực tế sẽ được nhà trường cung cấp.</p>

 <div class="mt-14 pt-10 border-t" style="border-color:var(--line);">
 <h2 class="serif text-[24px] md:text-[28px]" style="color:var(--plum);">Bài viết khác</h2>
 <div id="bv-others" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6"></div>
 </div>
 </div>
</section>

<div data-include="footer"></div>
<script src="js/components.js"></script>
<script>
 const fill = document.getElementById('dawn-arc-fill');
 const header = document.getElementById('site-header');
 window.addEventListener('scroll', () => {
 const h = document.documentElement;
 const pct = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
 fill.style.width = pct + '%';
 if (h.scrollTop > 40) { header.classList.add('header-blur'); header.style.boxShadow = '0 1px 0 rgba(34,61,61,0.08)'; }
 else { header.classList.remove('header-blur'); header.style.boxShadow = 'none'; }
 });
 const observer = new IntersectionObserver((entries) => {
 entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
 }, { threshold: 0.15 });
 document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
 const menuBtn = document.getElementById('menu-btn');
 const mobileMenu = document.getElementById('mobile-menu');
 if (menuBtn && mobileMenu) {
 menuBtn.addEventListener('click', () => { mobileMenu.classList.toggle('hidden'); mobileMenu.classList.toggle('flex'); });
 }

 // === Tải bài viết theo ?slug= ===
 function fmtDate(d) {
 const [y, m, day] = d.split('-');
 return `${day}/${m}/${y}`;
 }
 function esc(s) {
 return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
 }
 (async () => {
 try {
 const params = new URLSearchParams(location.search);
 const slug = params.get('slug');
 const res = await fetch('data/news.json', { cache: 'no-store' });
 const data = await res.json();
 const list = Array.isArray(data.news) ? data.news : [];
 const sorted = [...list].sort((a, b) => b.date.localeCompare(a.date));
 const post = list.find(n => n.slug === slug) || sorted[0];

 if (!post) { document.getElementById('bv-title').textContent = 'Không tìm thấy bài viết'; return; }

 document.title = post.title + ' — Mầm non Bình Minh';
 document.getElementById('bv-title').textContent = post.title;
 const tag = document.getElementById('bv-tag');
 tag.textContent = post.tag;
 tag.style.background = 'var(--chartreuse)';
 tag.style.color = 'var(--forest)';
 document.getElementById('bv-date').textContent = fmtDate(post.date);
 if (post.image) {
 const wrap = document.getElementById('bv-image-wrap');
 const img = document.getElementById('bv-image');
 img.src = post.image;
 img.alt = post.title;
 wrap.style.display = 'block';
 }
 const body = document.getElementById('bv-body');
 if (window.marked) { body.innerHTML = marked.parse(post.body || ''); }
 else { body.innerHTML = '<p>' + esc(post.excerpt || '') + '</p>'; }

 // Bài viết khác (2 bài gần nhất, khác bài hiện tại)
 const others = sorted.filter(n => n.slug !== post.slug).slice(0, 2);
 const othersEl = document.getElementById('bv-others');
 if (others.length) {
 othersEl.innerHTML = others.map(n => `
 <a href="bai-viet.html?slug=${encodeURIComponent(n.slug)}" class="card overflow-hidden focus-ring block group">
 <div class="img-frame" style="border-radius:0;"><img src="${n.image}" alt="${esc(n.title)}" class="w-full h-[150px] object-cover photo-grade group-hover:scale-105 transition-transform duration-500" loading="lazy"></div>
 <div class="p-5">
 <span class="tag">${esc(n.tag)}</span>
 <h3 class="serif text-[17px] leading-[1.3] mt-3" style="color:var(--plum);">${esc(n.title)}</h3>
 <p class="mt-2 text-[12px] tracking-[0.1em] font-semibold" style="color:var(--gold);">${fmtDate(n.date)}</p>
 </div>
 </a>`).join('\n ');
 }
 } catch (e) { console.error('Không tải được bài viết:', e); }
 })();
</script>
